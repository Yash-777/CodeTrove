<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codetrove</title>
  </head>
  <body>
    <!--
      This single <div id="root"> is the ONLY element React controls.
      Everything you see on screen is injected here by src/main.jsx.
      This pattern is called a "Single Page Application" (SPA): the browser
      loads this one HTML file once, and React swaps content in and out of
      #root as the user navigates, instead of requesting a new HTML page
      from a server every time.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
