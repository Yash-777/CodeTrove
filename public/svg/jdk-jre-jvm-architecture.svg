<svg data-dc-tpl="4" width="1100" height="1520" viewBox="0 0 1100 1520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Java architecture diagram: JDK contains JRE contains JVM with class loader, runtime data areas and execution engine, plus JNI and native libraries"><defs data-dc-tpl="5"><marker data-dc-tpl="6" id="mD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path data-dc-tpl="7" d="M0,0 L8,4 L0,8 z" fill="#4B5563"></path></marker></defs><text data-dc-tpl="8" x="40" y="70" class="s" font-size="46" font-weight="800"><tspan data-dc-tpl="9" fill="#6B7280">Code</tspan><tspan data-dc-tpl="10" fill="#EA580C">Trove</tspan></text><text data-dc-tpl="11" x="42" y="102" class="s" font-size="18" fill="#374151">Java architecture: JDK, JRE and JVM</text><rect data-dc-tpl="12" x="30" y="120" width="1040" height="1220" rx="14" fill="#F3F0E8" stroke="#8A7F66" stroke-width="2"></rect><text data-dc-tpl="13" x="55" y="152" class="s" font-size="18" font-weight="700" fill="#4B4430">JDK (JRE + development tools)</text><text data-dc-tpl="14" x="330" y="152" class="s" font-size="13" fill="#374151">javac, jar, jdb, jshell, javadoc</text><rect data-dc-tpl="15" x="60" y="175" width="980" height="1110" rx="14" fill="#E6F0FA" stroke="#2563EB" stroke-width="2"></rect><text data-dc-tpl="16" x="85" y="208" class="s" font-size="18" font-weight="700" fill="#1E3A8A">JRE (JVM + core class libraries)</text><text data-dc-tpl="17" x="385" y="208" class="s" font-size="13" fill="#374151">java.lang, java.util, java.io ...</text><rect data-dc-tpl="18" x="90" y="230" width="920" height="1000" rx="14" fill="#EFEAFB" stroke="#6D28D9" stroke-width="2"></rect><text data-dc-tpl="19" x="115" y="263" class="s" font-size="18" font-weight="700" fill="#4C1D95">JVM (loads, verifies and executes bytecode)</text><rect data-dc-tpl="20" x="120" y="285" width="860" height="120" rx="14" fill="#D5F2EA" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="21" x="550" y="313" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#115E59">Class Loader Subsystem</text><text data-dc-tpl="22" x="550" y="333" text-anchor="middle" class="s" font-size="13" fill="#374151">Loading → Linking (verify, prepare, resolve) → Initialization</text><rect data-dc-tpl="23" x="215" y="347" width="190" height="40" rx="8" fill="#ffffff" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="24" x="310.0" y="373.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Bootstrap</text><rect data-dc-tpl="25" x="435" y="347" width="190" height="40" rx="8" fill="#ffffff" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="26" x="530.0" y="373.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Platform</text><rect data-dc-tpl="27" x="655" y="347" width="190" height="40" rx="8" fill="#ffffff" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="28" x="750.0" y="373.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Application</text><rect data-dc-tpl="29" x="120" y="430" width="860" height="470" rx="14" fill="#FDEBDD" stroke="#C2410C" stroke-width="2"></rect><text data-dc-tpl="30" x="145" y="462" class="s" font-size="18" font-weight="700" fill="#7C2D12">Runtime Data Areas (memory)</text><rect data-dc-tpl="31" x="145" y="478" width="810" height="255" rx="14" fill="#FCEBC8" stroke="#B45309" stroke-width="2"></rect><text data-dc-tpl="32" x="170" y="508" class="s" font-size="18" font-weight="700" fill="#78350F">Heap (shared by all threads)</text><text data-dc-tpl="33" x="420" y="508" class="s" font-size="13" fill="#374151">objects and arrays live here</text><rect data-dc-tpl="34" x="165" y="525" width="460" height="125" rx="14" fill="#E4F3D0" stroke="#4D7C0F" stroke-width="2"></rect><text data-dc-tpl="35" x="185" y="553" class="s" font-size="18" font-weight="700" fill="#365314">Young Generation</text><text data-dc-tpl="36" x="345" y="553" class="s" font-size="13" fill="#374151">new objects</text><rect data-dc-tpl="37" x="181" y="568" width="134" height="70" rx="10" fill="#CFEFE6" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="38" x="248.0" y="601.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Eden</text><text data-dc-tpl="39" x="248.0" y="621.0" text-anchor="middle" class="s" font-size="13" fill="#374151">new objects start here</text><rect data-dc-tpl="40" x="325" y="568" width="134" height="70" rx="10" fill="#CFEFE6" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="41" x="392.0" y="601.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Survivor S0</text><text data-dc-tpl="42" x="392.0" y="621.0" text-anchor="middle" class="s" font-size="13" fill="#374151">copy target</text><rect data-dc-tpl="43" x="469" y="568" width="134" height="70" rx="10" fill="#CFEFE6" stroke="#0F766E" stroke-width="2"></rect><text data-dc-tpl="44" x="536.0" y="601.0" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#115E59">Survivor S1</text><text data-dc-tpl="45" x="536.0" y="621.0" text-anchor="middle" class="s" font-size="13" fill="#374151">copy target</text><rect data-dc-tpl="46" x="645" y="525" width="290" height="125" rx="14" fill="#FBDDE4" stroke="#BE123C" stroke-width="2"></rect><text data-dc-tpl="47" x="790.0" y="577.5" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#881337">Old Generation</text><text data-dc-tpl="48" x="790.0" y="597.5" text-anchor="middle" class="s" font-size="13" fill="#374151">long-lived objects</text><text data-dc-tpl="49" x="790.0" y="615.5" text-anchor="middle" class="s" font-size="13" fill="#374151">promoted from Young after many GCs</text><rect data-dc-tpl="50" x="165" y="664" width="770" height="56" rx="14" fill="#F6DDEB" stroke="#A21CAF" stroke-width="2"></rect><text data-dc-tpl="51" x="550.0" y="690.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#701A75">String Pool</text><text data-dc-tpl="52" x="550.0" y="710.0" text-anchor="middle" class="s" font-size="13" fill="#374151">reused string literals, stored once (inside the heap)</text><rect data-dc-tpl="53" x="145" y="755" width="190" height="125" rx="14" fill="#DCEAF8" stroke="#2563EB" stroke-width="2"></rect><text data-dc-tpl="54" x="240.0" y="807.5" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#1E3A8A">Stack</text><text data-dc-tpl="55" x="240.0" y="827.5" text-anchor="middle" class="s" font-size="13" fill="#374151">frames: locals, operand stack</text><text data-dc-tpl="56" x="240.0" y="845.5" text-anchor="middle" class="s" font-size="13" fill="#374151">per thread</text><rect data-dc-tpl="57" x="355" y="755" width="190" height="125" rx="14" fill="#DCEAF8" stroke="#2563EB" stroke-width="2"></rect><text data-dc-tpl="58" x="450.0" y="807.5" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#1E3A8A">PC Register</text><text data-dc-tpl="59" x="450.0" y="827.5" text-anchor="middle" class="s" font-size="13" fill="#374151">current instruction</text><text data-dc-tpl="60" x="450.0" y="845.5" text-anchor="middle" class="s" font-size="13" fill="#374151">per thread</text><rect data-dc-tpl="61" x="565" y="755" width="190" height="125" rx="14" fill="#DCEAF8" stroke="#2563EB" stroke-width="2"></rect><text data-dc-tpl="62" x="660.0" y="807.5" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#1E3A8A">Native Method Stack</text><text data-dc-tpl="63" x="660.0" y="827.5" text-anchor="middle" class="s" font-size="13" fill="#374151">native calls</text><text data-dc-tpl="64" x="660.0" y="845.5" text-anchor="middle" class="s" font-size="13" fill="#374151">per thread</text><rect data-dc-tpl="65" x="775" y="755" width="180" height="125" rx="14" fill="#FCEBC8" stroke="#B45309" stroke-width="2"></rect><text data-dc-tpl="66" x="865.0" y="807.5" text-anchor="middle" class="s" font-size="15" font-weight="700" fill="#78350F">Metaspace</text><text data-dc-tpl="67" x="865.0" y="827.5" text-anchor="middle" class="s" font-size="13" fill="#374151">class metadata (native memory)</text><text data-dc-tpl="68" x="865.0" y="845.5" text-anchor="middle" class="s" font-size="13" fill="#374151">shared, not in heap</text><rect data-dc-tpl="69" x="120" y="925" width="860" height="175" rx="14" fill="#EAF2D3" stroke="#65A30D" stroke-width="2"></rect><text data-dc-tpl="70" x="145" y="957" class="s" font-size="18" font-weight="700" fill="#3F6212">Execution Engine</text><rect data-dc-tpl="71" x="145" y="975" width="260" height="100" rx="14" fill="#DCEAF8" stroke="#2563EB" stroke-width="2"></rect><text data-dc-tpl="72" x="275.0" y="1023.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#1E3A8A">Interpreter</text><text data-dc-tpl="73" x="275.0" y="1043.0" text-anchor="middle" class="s" font-size="13" fill="#374151">runs bytecode line by line</text><rect data-dc-tpl="74" x="420" y="975" width="260" height="100" rx="14" fill="#FCEBC8" stroke="#B45309" stroke-width="2"></rect><text data-dc-tpl="75" x="550.0" y="1023.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#78350F">JIT Compiler</text><text data-dc-tpl="76" x="550.0" y="1043.0" text-anchor="middle" class="s" font-size="13" fill="#374151">hot code to native (C1, C2)</text><rect data-dc-tpl="77" x="695" y="975" width="260" height="100" rx="14" fill="#FBDDE4" stroke="#BE123C" stroke-width="2"></rect><text data-dc-tpl="78" x="825.0" y="1023.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#881337">Garbage Collector</text><text data-dc-tpl="79" x="825.0" y="1043.0" text-anchor="middle" class="s" font-size="13" fill="#374151">reclaims unreachable heap objects</text><rect data-dc-tpl="80" x="120" y="1125" width="860" height="80" rx="14" fill="#FBE0E8" stroke="#BE123C" stroke-width="2"></rect><text data-dc-tpl="81" x="550.0" y="1163.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#881337">Native Method Interface (JNI)</text><text data-dc-tpl="82" x="550.0" y="1183.0" text-anchor="middle" class="s" font-size="13" fill="#374151">Java Native Interface: bridge from the JVM to native code</text><path data-dc-tpl="83" d="M550 1207 V1385" stroke="#4B5563" stroke-width="2" fill="none" marker-end="url(#mD)"></path><rect data-dc-tpl="84" x="480" y="1290" width="140" height="26" rx="13" fill="#ffffff"></rect><text data-dc-tpl="85" x="550" y="1308" text-anchor="middle" class="s" font-size="12" fill="#374151">calls native code</text><rect data-dc-tpl="86" x="310" y="1390" width="480" height="76" rx="14" fill="#E4E0F7" stroke="#4338CA" stroke-width="2"></rect><text data-dc-tpl="87" x="550.0" y="1426.0" text-anchor="middle" class="s" font-size="17" font-weight="700" fill="#312E81">Native Method Libraries</text><text data-dc-tpl="88" x="550.0" y="1446.0" text-anchor="middle" class="s" font-size="13" fill="#374151">C / C++ (.dll, .so, .dylib), outside the JVM</text><text data-dc-tpl="89" x="550" y="1498" text-anchor="middle" class="s" font-size="12" fill="#6B7280">Metaspace replaced PermGen in Java 8 · the String Pool lives in the heap since Java 7</text></svg>